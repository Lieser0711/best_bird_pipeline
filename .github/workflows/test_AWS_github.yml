
name: Test AWS OIDC Connection

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  test-connection:
    runs-on: ubuntu-latest

    steps:
      - name: Check AWS Role Variable
        env:
          AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
        run: |
          if [ -z "$AWS_ROLE_ARN" ]; then
            echo "::error::AWS_ROLE_ARN is empty"
            exit 1
          fi
          echo "AWS_ROLE_ARN is configured"

      - name: Check OIDC Availability
        run: |
          if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then
            echo "::error::OIDC token request URL is missing"
            exit 1
          fi
          echo "OIDC token request is available"

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: eu-central-1

      - name: Verify AWS Identity
        run: aws sts get-caller-identity
